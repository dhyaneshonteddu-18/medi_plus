<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Border -->
  <rect width="400" height="300" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3"/>
  
  <!-- Medicine Bottle Icon - Larger and More Prominent -->
  <g transform="translate(140, 50)">
    <!-- Bottle Cap -->
    <rect x="35" y="0" width="50" height="20" rx="8" fill="#22c55e"/>
    <rect x="40" y="5" width="40" height="10" rx="3" fill="#16a34a"/>
    
    <!-- Bottle Body -->
    <path d="M 40 20 L 35 28 L 35 150 Q 35 165 50 165 L 70 165 Q 85 165 85 150 L 85 28 L 80 20 Z" 
          fill="#22c55e" opacity="0.9"/>
    
    <!-- Shine Effect -->
    <ellipse cx="50" cy="80" rx="8" ry="25" fill="white" opacity="0.3"/>
    
    <!-- Label -->
    <rect x="42" y="60" width="36" height="50" rx="4" fill="white" opacity="0.95"/>
    <line x1="48" y1="72" x2="70" y2="72" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="82" x2="70" y2="82" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="92" x2="65" y2="92" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cross Symbol on Label -->
    <circle cx="60" cy="102" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
    <line x1="57" y1="102" x2="63" y2="102" stroke="#ef4444" stroke-width="2"/>
    <line x1="60" y1="99" x2="60" y2="105" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Pills Around Bottle -->
    <g opacity="0.8">
      <!-- Pill 1 -->
      <ellipse cx="10" cy="170" rx="12" ry="10" fill="#22c55e"/>
      <line x1="10" y1="160" x2="10" y2="180" stroke="#16a34a" stroke-width="2"/>
      
      <!-- Pill 2 -->
      <ellipse cx="60" cy="185" rx="12" ry="10" fill="#16a34a"/>
      <line x1="60" y1="175" x2="60" y2="195" stroke="#15803d" stroke-width="2"/>
      
      <!-- Pill 3 -->
      <ellipse cx="110" cy="170" rx="12" ry="10" fill="#22c55e"/>
      <line x1="110" y1="160" x2="110" y2="180" stroke="#16a34a" stroke-width="2"/>
      
      <!-- Tablet 1 -->
      <circle cx="25" cy="190" r="8" fill="#dcfce7"/>
      <circle cx="25" cy="190" r="6" fill="none" stroke="#22c55e" stroke-width="1.5"/>
      
      <!-- Tablet 2 -->
      <circle cx="95" cy="190" r="8" fill="#dcfce7"/>
      <circle cx="95" cy="190" r="6" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Medical Cross Icon Top Right -->
  <g transform="translate(330, 30)">
    <circle cx="20" cy="20" r="18" fill="#22c55e" opacity="0.2"/>
    <line x1="14" y1="20" x2="26" y2="20" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="14" x2="20" y2="26" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="20" fill="#22c55e" text-anchor="middle" font-weight="bold">
    Medicine Image
  </text>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="500">
    Click to view detailed information
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="4" fill="#22c55e" opacity="0.4"/>
  <circle cx="350" cy="250" r="5" fill="#22c55e" opacity="0.3"/>
  <circle cx="30" cy="270" r="3" fill="#16a34a" opacity="0.4"/>
</svg>
